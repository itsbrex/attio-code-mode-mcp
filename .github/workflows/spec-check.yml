name: spec-check

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run spec:validate
      - run: npm run spec:check
      - run: npm run type-check
      - run: npm run build
      - run: npm test
      # Both upstream documents are public; no Attio credentials are needed.
      - name: Check public upstream drift
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run spec:upstream-check
